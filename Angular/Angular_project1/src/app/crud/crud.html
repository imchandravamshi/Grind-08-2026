<p>CRUD works!</p>
<div class="container">
  <h2 class="text-center m-4">CRUD operations</h2>
    <table class="table table-success table-striped">
       <thead>
            <tr>
                <th scope="col">id</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Phone</th>
            </tr>
        </thead>
            <tbody>
                <tr *ngFor="let data of apiData">
                    <td>{{data.id}}</td>
                    <td>{{data.name}}</td>
                    <td>{{data.email}}</td>
                    <td>{{data.phone}}</td>
                   
                </tr>
            </tbody>
    </table>

</div>
